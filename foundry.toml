[rpc_endpoints]
rpc_url = "${RPC_URL}"
monad_mainnet = "https://rpc1.monad.xyz"

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
