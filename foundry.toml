[rpc_endpoints]
rpc_url = "${RPC_URL}"
avalanche_mainnet = "https://avax.api.pocket.network"

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
# This protocol is deployed on chains enforcing EIP-170's 24,576-byte runtime
# code limit. A low run count prioritizes compact bytecode over marginally
# cheaper execution, allowing both DEX implementations to be deployed.
optimizer_runs = 1
via_ir = true

# Exercise real EIP-7702 delegation under Prague without changing the compiler
# or bytecode used by the existing market deployment scripts.
[profile.eip7702]
test = "test7702"
out = "out/eip7702"
cache_path = "cache/eip7702"
solc_version = "0.8.30"
evm_version = "prague"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
